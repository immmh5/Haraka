# fly.toml app configuration file generated for twq
# Optimized for Haraka SMTP Mail Server

app = 'twq'
primary_region = 'cdg'

[build]

[[services]]
  internal_port = 25
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 25

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
